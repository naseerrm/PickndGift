<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Store</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#ff6b00;
    color:white;
    padding:15px;
    text-align:center;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:15px;
    background:white;
}

input,select{
    padding:10px;
}

.product-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.slider{
    position:relative;
    height:220px;
}

.slider img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,.5);
    color:white;
    border:none;
    padding:8px;
    cursor:pointer;
}

.left{
    left:5px;
}

.right{
    right:5px;
}

.content{
    padding:15px;
}

.price{
    color:#ff6b00;
    font-size:20px;
    font-weight:bold;
}

.stock{
    margin-top:5px;
}

.instock{
    color:green;
}

.outstock{
    color:red;
}

.pagination{
    text-align:center;
    margin:20px;
}

.pagination button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.whatsapp-btn{
    flex:1;
    background:#25D366;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.call-btn{
    flex:1;
    background:#007bff;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.whatsapp-btn:hover{
    background:#1ea952;
}

.call-btn:hover{
    background:#0056b3;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:9999;
}

.modal-content{
    background:white;
    width:90%;
    max-width:900px;      /* Wider popup */
    height:85vh;          /* Takes 85% of screen height */
    overflow-y:auto;      /* Vertical scroll if content is large */
    margin:20px auto;
    padding:20px;
    border-radius:12px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:30px;
    cursor:pointer;
}

.modal-images{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

#popupMediaContainer{
    width:100%;
    text-align:center;
}

#popupMediaContainer img,
#popupMediaContainer video{
    width:100%;
    height:500px;
    object-fit:contain;
    border-radius:10px;
}

video{
    background:#000;
}

.modal-images img{
    width:100%;
    height:500px;         /* Increase image height */
    object-fit:contain;
}

.img-nav{
    font-size:25px;
    border:none;
    cursor:pointer;
    background:none;
}

#popupPrice{
    color:#ff6b00;
}

.whatsapp-btn{
    background:#25D366;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:5px;
}

.call-btn{
    background:#007bff;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:5px;
}


</style>
</head>
<body>

<header>
    <h1>My Toy Store</h1>
</header>

<div class="controls">

<input type="text" id="search" placeholder="Search Product">

<select id="priceSort">
    <option value="">Sort Price</option>
    <option value="low">Low To High</option>
    <option value="high">High To Low</option>
</select>

<select id="stockFilter">
    <option value="">All Stock</option>
    <option value="instock">In Stock</option>
    <option value="outstock">Out Of Stock</option>
</select>

<button onclick="filterProducts()">
Apply
</button>

</div>

<div class="product-container" id="products"></div>

<div class="pagination" id="pagination"></div>

<!-- Product Popup -->

<div id="productModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

      <div class="modal-images">

<button class="img-nav"
onclick="changePopupMedia(-1)">❮</button>

<div id="popupMediaContainer"></div>

<button class="img-nav"
onclick="changePopupMedia(1)">❯</button>

</div>

        <h2 id="popupName"></h2>

        <h3 id="popupPrice"></h3>

        <p id="popupStock"></p>

        <p id="popupDescription"></p>

        <div class="action-buttons">

            <a id="whatsappBtn"
               class="whatsapp-btn"
               target="_blank">
               📱 WhatsApp
            </a>

            <a id="callBtn"
               class="call-btn">
               📞 Call
            </a>

        </div>

    </div>

</div>

<script>

let products = [
{
    name:"Space Projector Night Light",
    price:599,
    stock:true,
    description:`
📦 Package Contains: 1 x Starry Projector Night Light, Remote Control, User Manual (Multicolor)

✨ Transform Your Space with a Mesmerizing Galaxy Effect

🚀 360° Adjustable Design

🎮 Remote Control & Timer Function

🌟 Multiple Color Modes

🎁 Perfect Gift for Kids & Space Lovers
`,
    media:[
        {
            type:"image",
            src:"https://m.media-amazon.com/images/I/71Hq4fQz2ML._SX679_.jpg"
        },
        {
            type:"image",
            src:"https://m.media-amazon.com/images/I/71EEw-w89PL._SX679_.jpg"
        },
        {
            type:"video",
            src:"https://www.instagram.com/reel/C92_4Cmodzj/?hvrq=NnVjazl4bHF3cnQ0"
        }
    ]
},

{
    name:"Building Blocks",
    price:199,
    stock:true,
    description:"Creative building blocks set for kids.",
    media:[
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/66ccff"
        },
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/99ffff"
        }
    ]
},

{
    name:"Dancing Robot",
    price:499,
    stock:false,
    description:"Musical dancing robot toy with lights.",
    media:[
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/cc99ff"
        },
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/ff99ff"
        }
    ]
},

{
    name:"Kids Train Set",
    price:399,
    stock:true,
    description:"Battery operated train set.",
    media:[
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/99ff99"
        },
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/66ff66"
        }
    ]
},

{
    name:"Toy Gun",
    price:249,
    stock:false,
    description:"Toy blaster gun for kids.",
    media:[
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/f4a460"
        },
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/deb887"
        }
    ]
},

{
    name:"Puzzle Game",
    price:129,
    stock:true,
    description:"Educational puzzle game.",
    media:[
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/87cefa"
        },
        {
            type:"image",
            src:"https://via.placeholder.com/300x220/00bfff"
        }
    ]
}
];


let currentPage = 1;
let perPage = 4;
let filteredProducts = [...products];
let popupMedia = [];
let popupMediaIndex = 0;

function changePopupMedia(step){

popupMediaIndex += step;

if(popupMediaIndex < 0)
popupMediaIndex = popupMedia.length - 1;

if(popupMediaIndex >= popupMedia.length)
popupMediaIndex = 0;

renderPopupMedia();

}


function renderProducts()
{

const container =
document.getElementById("products");

container.innerHTML="";

let start=(currentPage-1)*perPage;
let end=start+perPage;

let popupImages = [];
let popupIndex = 0;

function openProductModal(product){

popupMedia = product.media;

popupMediaIndex = 0;

renderPopupMedia();

document.getElementById("popupName").innerText =
product.name;

document.getElementById("popupPrice").innerText =
"₹"+product.price;

document.getElementById("popupStock").innerText =
product.stock ? "In Stock" : "Out Of Stock";

document.getElementById("popupDescription").innerText =
product.description || "";

document.getElementById("whatsappBtn").href =
"https://wa.me/917812060516?text=Hi I am interested in "+
encodeURIComponent(product.name);

document.getElementById("callBtn").href =
"tel:+917812060516";

document.getElementById("productModal").style.display =
"block";

}

function changePopupImage(step){

    popupIndex += step;

    if(popupIndex < 0)
        popupIndex = popupImages.length - 1;

    if(popupIndex >= popupImages.length)
        popupIndex = 0;

    document.getElementById("popupImage").src =
        popupImages[popupIndex];
}

document.querySelector(".close")
.addEventListener("click", () => {

    document.getElementById("productModal").style.display =
        "none";
});

window.onclick = function(event){

    const modal =
    document.getElementById("productModal");

    if(event.target === modal){
        modal.style.display = "none";
    }
};

document.addEventListener("keydown", (e)=>{

    if(e.key === "Escape"){

        document.getElementById("productModal").style.display =
            "none";
    }
});

let pageItems =
filteredProducts.slice(start,end);

pageItems.forEach((p,index)=>{

let currentImage=0;

const card=document.createElement("div");

card.className="card";

card.onclick = () => openProductModal(p);

card.innerHTML=`
<div class="slider">
<img id="img-${index}" src="${p.media[0].src}">

<button class="arrow left"
onclick="prevImage(${index},${JSON.stringify(p.media).replace(/"/g,'&quot;')})">❮</button>

<button class="arrow right"
onclick="nextImage(${index},${JSON.stringify(p.media).replace(/"/g,'&quot;')})">❯</button>

</div>

<div class="content">

<h3>${p.name}</h3>

<div class="price">₹${p.price}</div>

<div class="stock ${p.stock?'instock':'outstock'}">
${p.stock?'In Stock':'Out Of Stock'}
</div>

<br>

<div class="action-buttons">

    <a href="https://wa.me/917812060516" class="whatsapp-btn" target="_blank">
        📱 WhatsApp
    </a>

    <a href="tel:+917812060516" class="call-btn">
        📞 Call
    </a>

</div>
</div>
`;

card.dataset.current=0;

container.appendChild(card);

});

renderPagination();
}

function renderPopupMedia(){

const container =
document.getElementById("popupMediaContainer");

const current =
popupMedia[popupMediaIndex];

if(current.type==="video"){

container.innerHTML=`
<video controls autoplay width="100%">
<source src="${current.src}" type="video/mp4">
</video>
`;

}
else{

container.innerHTML=`
<img src="${current.src}" style="width:100%;height:500px;object-fit:contain;">
`;

}

}

function nextImage(index,media){

let img=document.getElementById(`img-${index}`);

let pos=parseInt(img.dataset.pos || 0);

pos++;

if(pos>=media.length)
pos=0;

while(media[pos].type==="video"){

pos++;

if(pos>=media.length)
pos=0;

}

img.src=media[pos].src;
img.dataset.pos=pos;

}

function prevImage(index,media){

let img=document.getElementById(`img-${index}`);

let pos=parseInt(img.dataset.pos || 0);

pos--;

if(pos<0)
pos=media.length-1;

while(media[pos].type==="video"){

pos--;

if(pos<0)
pos=media.length-1;

}

img.src=media[pos].src;
img.dataset.pos=pos;

}



function filterProducts(){

const search=
document.getElementById("search")
.value.toLowerCase();

const stock=
document.getElementById("stockFilter").value;

const sort=
document.getElementById("priceSort").value;

filteredProducts=
products.filter(p => {

let matchName =
p.name.toLowerCase().includes(search);

let matchStock = true;

if(stock==="instock")
matchStock=p.stock;

if(stock==="outstock")
matchStock=!p.stock;

return matchName && matchStock;

});

if(sort==="low"){
filteredProducts.sort((a,b)=>a.price-b.price);
}

if(sort==="high"){
filteredProducts.sort((a,b)=>b.price-a.price);
}

currentPage=1;

renderProducts();
}

function renderPagination(){

const totalPages=
Math.ceil(filteredProducts.length/perPage);

const pageDiv=
document.getElementById("pagination");

pageDiv.innerHTML="";

for(let i=1;i<=totalPages;i++){

pageDiv.innerHTML +=
`<button onclick="goPage(${i})">${i}</button>`;
}
}

function goPage(page){
currentPage=page;
renderProducts();
}

renderProducts();

</script>

</body>
</html>
