<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6b00">
  <meta name="description" content="Browse toys, compare prices and contact My Toy Store.">
  <title>PickndGift</title>
  <style>
    :root {
      --brand: #ff6b00; --brand-dark: #e85d00; --ink: #202124;
      --muted: #667085; --surface: #fff; --page: #f5f6f8;
      --line: #e7e9ee; --green: #16803c; --red: #c62828;
      --radius: 16px; --shadow: 0 5px 22px rgba(16,24,40,.09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--page); }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(255,107,0,.35); outline-offset: 2px; }
    .site-header { color: white; background: linear-gradient(120deg,#f45b00,#ff8b24); }
    .header-inner { max-width: 1280px; margin: auto; padding: 24px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand h1 { margin: 0; font-size: clamp(1.45rem,3vw,2rem); letter-spacing: -.5px; }
    .brand p { margin: 5px 0 0; opacity: .92; font-size: .92rem; }
    .header-contact { color: white; text-decoration: none; border: 1px solid rgba(255,255,255,.65); border-radius: 999px; padding: 10px 16px; font-weight: 700; white-space: nowrap; }
    .header-contact:hover { background: rgba(255,255,255,.15); }
    .main { max-width: 1280px; margin: auto; padding: 24px 22px 42px; }
    .intro { margin: 0 0 18px; }
    .intro h2 { margin: 0 0 5px; font-size: clamp(1.25rem,2.4vw,1.7rem); }
    .intro p { color: var(--muted); margin: 0; }
    .toolbar { display: grid; grid-template-columns: minmax(220px,2fr) repeat(3,minmax(145px,1fr)) auto; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 8px rgba(16,24,40,.03); }
    .field { min-width: 0; width: 100%; border: 1px solid #d9dde5; border-radius: 10px; padding: 11px 12px; background: white; color: var(--ink); }
    .field:focus { border-color: var(--brand); outline: 2px solid rgba(255,107,0,.12); }
    .btn { border: 0; border-radius: 10px; padding: 11px 16px; background: var(--brand); color: white; font-weight: 700; cursor: pointer; transition: background .18s, transform .18s; }
    .btn:hover { background: var(--brand-dark); }
    .btn:active { transform: translateY(1px); }
    .btn.secondary { background: #eef0f3; color: #30343b; }
    .btn.secondary:hover { background: #e1e4e9; }
    .results-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 18px 2px 12px; color: var(--muted); font-size: .92rem; }
    .product-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 18px; }
    .product-card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(16,24,40,.13); }
    .product-media { position: relative; background: #f0f1f3; aspect-ratio: 4/3; overflow: hidden; }
    .product-media img { width: 100%; height: 100%; display: block; object-fit: cover; cursor: pointer; }
    .media-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(20,20,20,.62); color: white; cursor: pointer; display: grid; place-items: center; font-size: 18px; }
    .media-arrow:hover { background: rgba(20,20,20,.85); }
    .media-arrow.prev { left: 9px; } .media-arrow.next { right: 9px; }
    .media-count { position: absolute; right: 10px; bottom: 10px; padding: 4px 8px; border-radius: 99px; background: rgba(0,0,0,.6); color: white; font-size: .72rem; }
    .stock-pill { position: absolute; left: 10px; top: 10px; padding: 5px 9px; border-radius: 99px; background: rgba(255,255,255,.95); font-size: .72rem; font-weight: 800; }
    .stock-pill.in { color: var(--green); } .stock-pill.out { color: var(--red); }
    .product-content { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .product-content h3 { margin: 0 0 8px; font-size: 1.05rem; line-height: 1.35; }
    .price { color: var(--brand-dark); font-size: 1.35rem; font-weight: 850; }
    .stock-text { margin: 5px 0 0; font-size: .85rem; font-weight: 650; }
    .stock-text.in { color: var(--green); } .stock-text.out { color: var(--red); }
    .card-actions { display: flex; gap: 8px; margin-top: 14px; }
    .contact-btn { flex: 1; min-width: 0; text-align: center; text-decoration: none; color: white; border-radius: 9px; padding: 10px 8px; font-size: .88rem; font-weight: 750; }
    .contact-btn.whatsapp { background: #20b95a; } .contact-btn.call { background: #1673d1; }
    .contact-btn:hover { filter: brightness(.94); }
    .details-btn { margin-top: 9px; width: 100%; background: #fff3e9; color: #b84b00; border: 1px solid #ffddc5; border-radius: 9px; padding: 9px; font-weight: 750; cursor: pointer; }
    .details-btn:hover { background: #ffe8d7; }
    .empty-state { grid-column: 1/-1; background: white; border: 1px dashed #cbd0d9; border-radius: var(--radius); text-align: center; padding: 48px 20px; color: var(--muted); }
    .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 7px; margin: 26px 0 0; }
    .page-btn { min-width: 40px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); cursor: pointer; }
    .page-btn.active { background: var(--brand); color: white; border-color: var(--brand); font-weight: 800; }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(12,16,22,.78); padding: 18px; overflow-y: auto; }
    .modal.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-panel { position: relative; width: min(100%,980px); margin: auto; background: white; border-radius: 18px; padding: 22px; box-shadow: 0 20px 70px rgba(0,0,0,.3); }
    .modal-close { position: absolute; z-index: 2; right: 13px; top: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #f0f1f3; color: #222; font-size: 26px; cursor: pointer; }
    .modal-layout { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(260px,.85fr); gap: 26px; align-items: start; padding-top: 28px; }
    .modal-viewer { position: relative; min-width: 0; background: #f1f2f4; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 300px; }
    .modal-viewer img, .modal-viewer video { width: 100%; max-height: min(65vh,620px); object-fit: contain; display: block; }
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: white; cursor: pointer; font-size: 20px; }
    .modal-nav.prev { left: 10px; } .modal-nav.next { right: 10px; }
    .modal-info h2 { margin: 0 42px 10px 0; font-size: clamp(1.35rem,3vw,1.9rem); }
    .modal-info .price { font-size: 1.65rem; }
    .modal-info .description { color: #4b5563; line-height: 1.65; white-space: pre-line; margin: 18px 0; }
    .modal-info .card-actions { margin-top: 20px; }
    .media-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; }
    .thumb { flex: 0 0 66px; width: 66px; height: 58px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #eee; cursor: pointer; }
    .thumb.active { border-color: var(--brand); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .site-footer { text-align: center; padding: 22px; color: var(--muted); font-size: .88rem; }
    @media (max-width: 1050px) {
      .product-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .toolbar { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .toolbar .search-field { grid-column: span 2; }
    }
    @media (max-width: 700px) {
      .header-inner { padding: 19px 16px; }
      .header-contact { padding: 9px 11px; font-size: .82rem; }
      .main { padding: 20px 14px 32px; }
      .toolbar { grid-template-columns: 1fr 1fr; padding: 11px; gap: 8px; }
      .toolbar .search-field { grid-column: 1/-1; }
      .toolbar .apply-btn { grid-column: 1/-1; }
      .product-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
      .product-content { padding: 12px; }
      .product-content h3 { font-size: .96rem; }
      .price { font-size: 1.2rem; }
      .contact-btn { font-size: .78rem; padding: 9px 5px; }
      .card-actions { gap: 6px; }
      .modal { padding: 9px; }
      .modal-panel { padding: 14px; border-radius: 14px; }
      .modal-layout { grid-template-columns: 1fr; gap: 16px; padding-top: 26px; }
      .modal-viewer { min-height: 220px; }
      .modal-viewer img, .modal-viewer video { max-height: 48vh; }
      .modal-info h2 { margin-right: 38px; }
    }
    @media (max-width: 380px) {
      .brand p { font-size: .78rem; }
      .header-contact { font-size: .75rem; }
      .product-grid { gap: 9px; }
      .product-content { padding: 10px; }
      .product-content h3 { font-size: .88rem; }
      .contact-btn { font-size: .72rem; }
      .media-arrow { width: 30px; height: 30px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><h1>🧸 Pick and Gift Items</h1><p>Fun, learning and little surprises for everyone</p></div>
      <a class="header-contact" href="https://wa.me/917812060516" target="_blank" rel="noopener">Contact Store</a>
    </div>
  </header>

  <main class="main">
    <section class="intro">
      <h2>Explore our products</h2>
      <p>Find your favourite toy and contact us directly to place an order.</p>
    </section>

    <section class="toolbar" aria-label="Product filters">
      <input class="field search-field" id="search" type="search" placeholder="Search products…" aria-label="Search products">
      <select class="field" id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
      <select class="field" id="priceSort" aria-label="Sort by price">
        <option value="">Sort by price</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option>
      </select>
      <select class="field" id="stockFilter" aria-label="Filter by stock">
        <option value="">All stock</option><option value="instock">In stock</option><option value="outstock">Out of stock</option>
      </select>
      <button class="btn apply-btn" id="applyFilters" type="button">Apply filters</button>
    </section>

    <div class="results-row"><span id="resultCount" aria-live="polite"></span><button class="btn secondary" id="resetFilters" type="button">Reset</button></div>
    <section class="product-grid" id="products" aria-label="Products"></section>
    <nav class="pagination" id="pagination" aria-label="Product pages"></nav>
  </main>

  <footer class="site-footer">© <span id="year"></span> My Toy Store. All rights reserved.</footer>

  <div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="popupName">
    <div class="modal-panel">
      <button class="modal-close" id="closeModal" type="button" aria-label="Close product details">&times;</button>
      <div class="modal-layout">
        <div>
          <div class="modal-viewer" id="popupMediaContainer">
            <button class="modal-nav prev" id="popupPrev" type="button" aria-label="Previous media">❮</button>
            <button class="modal-nav next" id="popupNext" type="button" aria-label="Next media">❯</button>
          </div>
          <div class="media-thumbs" id="mediaThumbs" aria-label="Product media thumbnails"></div>
        </div>
        <div class="modal-info">
          <h2 id="popupName"></h2>
          <div class="price" id="popupPrice"></div>
          <p class="stock-text" id="popupStock"></p>
          <p class="description" id="popupDescription"></p>
          <div class="card-actions">
            <a id="whatsappBtn" class="contact-btn whatsapp" target="_blank" rel="noopener">📱 WhatsApp</a>
            <a id="callBtn" class="contact-btn call">📞 Call</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Store contact details in one place so they can be changed easily.
    const STORE_PHONE = "917812060516";
    const STORE_TEL = "+917812060516";
    const ITEMS_PER_PAGE = 8;

    // Keep product data here. Add category and media items as required.
    const products = [
      {
        name: "Space Projector Night Light", category: "Lights", price: 599, stock: true,
        description: `📦 Package Contains: 1 x Starry Projector Night Light, Remote Control, User Manual (Multicolor)

✨ Transform Your Space with a Mesmerizing Galaxy Effect

🚀 360° Adjustable Design

🎮 Remote Control & Timer Function

🌟 Multiple Color Modes

🎁 Perfect Gift for Kids & Space Lovers`,
        media: [
          { type: "image", src: "https://m.media-amazon.com/images/I/71Hq4fQz2ML._SX679_.jpg" },
          { type: "image", src: "https://m.media-amazon.com/images/I/71EEw-w89PL._SX679_.jpg" },
          // Instagram reel pages are not direct MP4 media URLs. Replace this with a direct .mp4 URL to play inside the gallery.
          { type: "link", src: "https://www.instagram.com/reel/C92_4Cmodzj/", label: "Watch product video on Instagram" }
        ]
      },
      { name: "Building Blocks", category: "Educational", price: 199, stock: true, description: "Creative building blocks set for kids.", media: [
        { type: "image", src: "https://placehold.co/600x450/66ccff/123?text=Building+Blocks" },
        { type: "image", src: "https://placehold.co/600x450/99ffff/123?text=Building+Blocks+Set" }
      ]},
      { name: "Dancing Robot", category: "Electronic", price: 499, stock: false, description: "Musical dancing robot toy with lights.", media: [
        { type: "image", src: "https://placehold.co/600x450/cc99ff/123?text=Dancing+Robot" },
        { type: "image", src: "https://placehold.co/600x450/ff99ff/123?text=Robot+Toy" }
      ]},
      { name: "Kids Train Set", category: "Vehicles", price: 399, stock: true, description: "Battery operated train set.", media: [
        { type: "image", src: "https://placehold.co/600x450/99ff99/123?text=Kids+Train+Set" },
        { type: "image", src: "https://placehold.co/600x450/66ff66/123?text=Toy+Train" }
      ]},
      { name: "Toy Gun", category: "Action Toys", price: 249, stock: false, description: "Toy blaster gun for kids.", media: [
        { type: "image", src: "https://placehold.co/600x450/f4a460/123?text=Toy+Blaster" },
        { type: "image", src: "https://placehold.co/600x450/deb887/123?text=Toy+Blaster+Set" }
      ]},
      { name: "Puzzle Game", category: "Educational", price: 129, stock: true, description: "Educational puzzle game.", media: [
        { type: "image", src: "https://placehold.co/600x450/87cefa/123?text=Puzzle+Game" },
        { type: "image", src: "https://placehold.co/600x450/00bfff/123?text=Kids+Puzzle" }
      ]}
    ];

    let filteredProducts = [...products];
    let currentPage = 1;
    let activeProduct = null;
    let popupMediaIndex = 0;
    const imagePositions = new Map();

    const $ = (id) => document.getElementById(id);
    const productsEl = $("products");
    const modal = $("productModal");

    function safeMedia(product) {
      return (product.media || []).filter(item => item && item.src);
    }
    function imageItems(product) {
      return safeMedia(product).filter(item => item.type === "image");
    }
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function whatsappURL(product) {
      const message = `Hi, I am interested in ${product.name}. Please share the details.`;
      return `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(message)}`;
    }
    function buildCategoryOptions() {
      const select = $("categoryFilter");
      [...new Set(products.map(p => p.category).filter(Boolean))].sort().forEach(category => {
        const option = document.createElement("option");
        option.value = category; option.textContent = category; select.appendChild(option);
      });
    }
    function renderProducts() {
      productsEl.replaceChildren();
      const totalPages = Math.ceil(filteredProducts.length / ITEMS_PER_PAGE);
      if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = filteredProducts.slice(start, start + ITEMS_PER_PAGE);

      $("resultCount").textContent = `${filteredProducts.length} product${filteredProducts.length === 1 ? "" : "s"} found`;

      if (!pageItems.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = "<strong>No products found</strong><p>Try changing your search or filters.</p>";
        productsEl.appendChild(empty);
      } else {
        pageItems.forEach(product => productsEl.appendChild(createProductCard(product)));
      }
      renderPagination(totalPages);
    }
    function createProductCard(product) {
      const card = document.createElement("article");
      card.className = "product-card";
      const images = imageItems(product);
      const imageIndex = imagePositions.get(product.name) || 0;
      const currentImage = images[imageIndex] || images[0];
      const imageSrc = currentImage?.src || "https://placehold.co/600x450?text=No+Image";
      const stockLabel = product.stock ? "In stock" : "Out of stock";
      card.innerHTML = `
        <div class="product-media">
          <img class="card-image" src="${escapeHTML(imageSrc)}" alt="${escapeHTML(product.name)}" loading="lazy">
          <span class="stock-pill ${product.stock ? "in" : "out"}">${stockLabel}</span>
          ${images.length > 1 ? `<button class="media-arrow prev" type="button" aria-label="Previous image">❮</button><button class="media-arrow next" type="button" aria-label="Next image">❯</button><span class="media-count">${imageIndex + 1}/${images.length}</span>` : ""}
        </div>
        <div class="product-content">
          <h3>${escapeHTML(product.name)}</h3>
          <div class="price">₹${Number(product.price).toLocaleString("en-IN")}</div>
          <p class="stock-text ${product.stock ? "in" : "out"}">${stockLabel}</p>
          <div class="card-actions">
            <a class="contact-btn whatsapp" href="${whatsappURL(product)}" target="_blank" rel="noopener">📱 WhatsApp</a>
            <a class="contact-btn call" href="tel:${STORE_TEL}">📞 Call</a>
          </div>
          <button class="details-btn" type="button">View product details</button>
        </div>`;
      const img = card.querySelector(".card-image");
      img.addEventListener("error", () => { img.src = "https://placehold.co/600x450?text=Image+unavailable"; }, { once: true });
      img.addEventListener("click", () => openProductModal(product));
      card.querySelector(".details-btn").addEventListener("click", () => openProductModal(product));
      const prev = card.querySelector(".media-arrow.prev");
      const next = card.querySelector(".media-arrow.next");
      if (prev) prev.addEventListener("click", () => changeCardImage(product, -1));
      if (next) next.addEventListener("click", () => changeCardImage(product, 1));
      return card;
    }
    function changeCardImage(product, step) {
      const images = imageItems(product);
      if (images.length < 2) return;
      const current = imagePositions.get(product.name) || 0;
      imagePositions.set(product.name, (current + step + images.length) % images.length);
      renderProducts();
    }
    function renderPagination(totalPages) {
      const nav = $("pagination");
      nav.replaceChildren();
      if (totalPages <= 1) return;
      const previous = makePageButton("Previous", currentPage - 1, currentPage === 1);
      nav.appendChild(previous);
      for (let page = 1; page <= totalPages; page++) {
        const button = makePageButton(String(page), page, false);
        if (page === currentPage) { button.classList.add("active"); button.setAttribute("aria-current", "page"); }
        nav.appendChild(button);
      }
      nav.appendChild(makePageButton("Next", currentPage + 1, currentPage === totalPages));
    }
    function makePageButton(label, page, disabled) {
      const button = document.createElement("button");
      button.type = "button"; button.className = "page-btn"; button.textContent = label; button.disabled = disabled;
      button.addEventListener("click", () => { currentPage = page; renderProducts(); $("products").scrollIntoView({ behavior: "smooth", block: "start" }); });
      return button;
    }
    function applyFilters() {
      const query = $("search").value.trim().toLocaleLowerCase();
      const category = $("categoryFilter").value;
      const stock = $("stockFilter").value;
      const sort = $("priceSort").value;
      filteredProducts = products.filter(product => {
        const matchesText = `${product.name} ${product.description || ""} ${product.category || ""}`.toLocaleLowerCase().includes(query);
        const matchesCategory = !category || product.category === category;
        const matchesStock = !stock || (stock === "instock" ? product.stock : !product.stock);
        return matchesText && matchesCategory && matchesStock;
      });
      if (sort === "low") filteredProducts.sort((a,b) => a.price - b.price);
      if (sort === "high") filteredProducts.sort((a,b) => b.price - a.price);
      currentPage = 1;
      renderProducts();
    }
    function openProductModal(product) {
      activeProduct = product;
      popupMediaIndex = 0;
      $("popupName").textContent = product.name;
      $("popupPrice").textContent = `₹${Number(product.price).toLocaleString("en-IN")}`;
      $("popupStock").textContent = product.stock ? "In stock" : "Out of stock";
      $("popupStock").className = `stock-text ${product.stock ? "in" : "out"}`;
      $("popupDescription").textContent = product.description || "No description available.";
      $("whatsappBtn").href = whatsappURL(product);
      $("callBtn").href = `tel:${STORE_TEL}`;
      renderPopupMedia();
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
      $("closeModal").focus();
    }
    function renderPopupMedia() {
      const media = safeMedia(activeProduct || { media: [] });
      const container = $("popupMediaContainer");
      // Keep navigation buttons while replacing only the media element.
      container.querySelectorAll("img, video, a.media-link, p.no-media").forEach(node => node.remove());
      if (!media.length) {
        const message = document.createElement("p"); message.className = "no-media"; message.textContent = "No product media available.";
        container.appendChild(message);
      } else {
        const current = media[popupMediaIndex];
        if (current.type === "video") {
          const video = document.createElement("video"); video.controls = true; video.playsInline = true;
          video.src = current.src; video.setAttribute("aria-label", `${activeProduct.name} video`);
          container.appendChild(video);
        } else if (current.type === "link") {
          const link = document.createElement("a"); link.className = "media-link"; link.href = current.src;
          link.target = "_blank"; link.rel = "noopener"; link.textContent = current.label || "Open product video";
          link.style.cssText = "padding:30px;text-align:center;color:#b84b00;font-weight:700;";
          container.appendChild(link);
        } else {
          const img = document.createElement("img"); img.src = current.src; img.alt = activeProduct.name; img.loading = "eager";
          img.addEventListener("error", () => { img.src = "https://placehold.co/800x600?text=Image+unavailable"; }, { once: true });
          container.appendChild(img);
        }
      }
      $("popupPrev").hidden = media.length < 2;
      $("popupNext").hidden = media.length < 2;
      renderThumbnails(media);
    }
    function renderThumbnails(media) {
      const thumbs = $("mediaThumbs"); thumbs.replaceChildren();
      media.forEach((item, index) => {
        const button = document.createElement("button"); button.type = "button";
        button.className = `thumb ${index === popupMediaIndex ? "active" : ""}`;
        button.setAttribute("aria-label", `Show media ${index + 1}`);
        if (item.type === "image") {
          const img = document.createElement("img"); img.src = item.src; img.alt = ""; button.appendChild(img);
        } else { button.textContent = item.type === "video" ? "▶ Video" : "↗ Link"; }
        button.addEventListener("click", () => { popupMediaIndex = index; renderPopupMedia(); });
        thumbs.appendChild(button);
      });
    }
    function changePopupMedia(step) {
      const media = safeMedia(activeProduct || { media: [] });
      if (media.length < 2) return;
      popupMediaIndex = (popupMediaIndex + step + media.length) % media.length;
      renderPopupMedia();
    }
    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      const video = $("popupMediaContainer").querySelector("video");
      if (video) video.pause();
      activeProduct = null;
    }

    $("applyFilters").addEventListener("click", applyFilters);
    $("search").addEventListener("input", applyFilters);
    $("categoryFilter").addEventListener("change", applyFilters);
    $("priceSort").addEventListener("change", applyFilters);
    $("stockFilter").addEventListener("change", applyFilters);
    $("resetFilters").addEventListener("click", () => {
      $("search").value = ""; $("categoryFilter").value = ""; $("priceSort").value = ""; $("stockFilter").value = "";
      applyFilters();
    });
    $("closeModal").addEventListener("click", closeModal);
    $("popupPrev").addEventListener("click", () => changePopupMedia(-1));
    $("popupNext").addEventListener("click", () => changePopupMedia(1));
    modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
    document.addEventListener("keydown", event => {
      if (!modal.classList.contains("open")) return;
      if (event.key === "Escape") closeModal();
      if (event.key === "ArrowLeft") changePopupMedia(-1);
      if (event.key === "ArrowRight") changePopupMedia(1);
    });

    $("year").textContent = new Date().getFullYear();
    buildCategoryOptions();
    renderProducts();
  </script>
</body>
</html>
